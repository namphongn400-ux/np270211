<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>

    <header class="header">
        <h1 class="logo"> CINEMA X</h1>
    </header>

    <main class="main-container">
        
       
        <div class="form-box" id="login-form">
            <h2>Sign In</h2>
            <form id="form-login-element" novalidate>
                <div class="input-group">
                    <input type="text" id="login-email" placeholder=" ">
                    <label for="login-email">Email</label>
                    <small class="error-msg"></small>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder=" ">
                    <label for="login-password">Password</label>
                    <small class="error-msg"></small>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
                
                <div class="form-help">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="need-help">Need help?</a>
                </div>
            </form>
            <div class="form-switch">
                <p> Cinema X? <a href="#" id="to-register">Sign up now</a></p>
            </div>
        </div>

        
        <div class="form-box hidden" id="register-form">
            <h2>Sign Up</h2>
            <form id="form-register-element" novalidate>
                <div class="input-group">
                    <input type="text" id="reg-username" placeholder=" ">
                    <label for="reg-username">Username</label>
                    <small class="error-msg"></small>
                </div>

                <div class="input-group">
                    <input type="email" id="reg-email" placeholder=" ">
                    <label for="reg-email">Email address</label>
                    <small class="error-msg"></small>
                </div>

                <div class="input-group">
                    <input type="password" id="reg-password" placeholder=" ">
                    <label for="reg-password">Password</label>
                    <small class="error-msg"></small>
                </div>

                <div class="input-group">
                    <input type="password" id="reg-verify-password" placeholder=" ">
                    <label for="reg-verify-password">Verify Password</label>
                    <small class="error-msg"></small>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>
            </form>
            <div class="form-switch">
                <p>Already have an account? <a href="#" id="to-login">Sign in now</a></p>
            </div>
        </div>

    </main>

    <script src="sc.js"></script>
</body>
</html>
